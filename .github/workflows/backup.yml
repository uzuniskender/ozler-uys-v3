name: Günlük Supabase Yedeği

# Secret'lar (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_HOST     — örn. aws-0-eu-central-1.pooler.supabase.com
#   SUPABASE_USER     — örn. postgres.<project-ref>  (pooler kullanıcı formatı)
#   SUPABASE_PASSWORD — DB şifresi
#   SUPABASE_DB       — örn. postgres
#
# Notlar:
# - GitHub Actions runner'ları IPv6 desteklemediğinden direct connection
#   (db.<ref>.supabase.co:5432) çalışmaz. Session pooler (port 5432) IPv4
#   sunar ve pg_dump için gereken uzun session'ları destekler.
# - Transaction pooler (port 6543) pg_dump için uygun DEĞİL.
# - pg_dump versiyonu server >= olmalı; bu yüzden postgresql-client-17 kurulur.

permissions:
  contents: write

on:
  schedule:
    # Her gün UTC 03:00 = Türkiye saati 06:00 (mesai öncesi)
    - cron: '0 3 * * *'
  # Actions sayfasından manuel tetikleme için
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # pg_dump prompt'a düşmesin — PGPASSWORD tek tanımla, tüm adımlar görsün
      PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Set date variables
        run: |
          echo "BACKUP_DATE=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "BACKUP_TIME=$(date -u +'%H:%M UTC')" >> $GITHUB_ENV

      - name: Create backup directory
        run: mkdir -p backups/${{ env.BACKUP_DATE }}

      # NOT: pg_dumpall --roles-only kaldırıldı — Supabase session pooler
      # pg_dumpall'ı desteklemiyor (multi-db connection gerektirir).
      # Role bilgileri zaten Supabase Auth tarafından yönetiliyor, kullanıcı
      # tablolarımız (uys_kullanicilar) public schema'da olduğu için data
      # dump'ında dahil. Restore için role recreation gerekirse Supabase
      # Studio üzerinden manuel yapılmalı.

      - name: Dump schema
        run: |
          pg_dump \
            -h "${{ secrets.SUPABASE_HOST }}" \
            -U "${{ secrets.SUPABASE_USER }}" \
            -d "${{ secrets.SUPABASE_DB }}" \
            -p 5432 \
            --schema-only \
            --no-owner \
            --no-privileges \
            -f backups/${{ env.BACKUP_DATE }}/schema.sql

      - name: Dump data
        run: |
          pg_dump \
            -h "${{ secrets.SUPABASE_HOST }}" \
            -U "${{ secrets.SUPABASE_USER }}" \
            -d "${{ secrets.SUPABASE_DB }}" \
            -p 5432 \
            --data-only \
            --no-owner \
            --no-privileges \
            -f backups/${{ env.BACKUP_DATE }}/data.sql

      - name: Check file sizes
        run: ls -lh backups/${{ env.BACKUP_DATE }}/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Yeni yedek yok (commit atılmadı)"
          else
            git commit -m "Yedek $BACKUP_DATE ($BACKUP_TIME)"
            git pull --rebase
            git push
          fi
