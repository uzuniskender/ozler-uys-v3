name: DevSync — Supabase

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # önceki commit ile diff için

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync changed files to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node .github/scripts/devsync.js
